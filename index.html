<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartslot - Secure Entry Gateway</title>
    <!-- Humari CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Main Platform Banner -->
        <div class="logo-section">
            <span style="font-size: 40px;">⏰</span>
            <h2 style="margin-top: 10px; color: #1e293b;">Smartslot Platform</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Book Anything Online & Save Time</p>
        </div>

        <!-- TWO TABS FOR LOGIN DIRECTION -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button id="btn-student-view" onclick="toggleLoginView('student')" style="background-color: #007bff;">Student Access</button>
            <button id="btn-admin-view" onclick="toggleLoginView('admin')" style="background-color: #64748b;">Admin Access Portal</button>
        </div>

        <!-- FORM A: STUDENT ACCESS FORM -->
        <div id="student-login-box">
            <div class="form-group">
                <label style="display: block; text-align: left; font-weight: bold; color: #475569;">Your Registered Name:</label>
                <input type="text" id="student-username" placeholder="Type full student name...">
            </div>
            <button onclick="handleStudentLogin()">Access Booking Panel 🚀</button>
        </div>

        <!-- FORM B: ADMIN ACCESS FORM (PASSWORD SYSTEM) -->
        <div id="admin-login-box" style="display: none; text-align: left;">
            <div class="form-group">
                <label style="display: block; font-weight: bold; color: #475569;">Admin Password:</label>
                <!-- Security ke liye input type="password" kiya hai taaki dots dikhein -->
                <input type="password" id="admin-password" placeholder="Enter Admin Password...">
            </div>
            <button onclick="handleAdminLogin()" style="background-color: #16a34a;">Verify Password & Login 🔐</button>
            
            <p style="font-size: 12px; color: #999; margin-top: 15px; text-align: center;">
                💡 <strong>Hackathon Password:</strong> Admin@123
            </p>
        </div>

    </div>

    <!-- Login JS file link -->
    <script src="login.js"></script>
</body>
</html>
